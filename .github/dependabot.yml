version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
